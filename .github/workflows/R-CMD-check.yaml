# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          # The lowest R version in DESCRIPTION:
          - {os: ubuntu-latest,   r: '4.4'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
              any::rcmdcheck
              any::BH
              any::Rcpp
              any::RcppEigen
              any::RcppParallel
              any::StanHeaders
          needs: check

      # Keep the brms fits of the tests (see `PROJPRED_TESTS_BFITS` in
      # tests/testthat/setup.R) between the runs, so that most runs do not
      # compile the brms models. For a stored fit, brms compares the data, the
      # Stan code and the algorithm (`file_refit = "on_change"`), but not,
      # e.g., the seed, and the stored fit holds the compiled model. So the
      # key has all that the fits depend on: the runner image, the versions
      # of R and of the packages, and the files that define the fits. There
      # are no `restore-keys`: a new key gives new fits.
      - name: Set the directory and the cache key of the brms fits
        id: bfits
        shell: bash
        run: |
          echo "PROJPRED_TESTS_BFITS=$RUNNER_TEMP/bfits" >> "$GITHUB_ENV"
          pkgs=$(Rscript -e 'p <- c("brms", "rstan", "StanHeaders", "RcppParallel", "mgcv"); cat(paste0(c("R", p), "-", c(as.character(getRversion()), sapply(p, function(x) as.character(packageVersion(x)))), collapse = "_"))')
          echo "key=bfits-${ImageOS:-$RUNNER_OS}-$RUNNER_ARCH-$pkgs" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bfits
          key: ${{ steps.bfits.outputs.key }}-${{ hashFiles('tests/testthat/setup.R', 'tests/testthat/helpers/*.R', 'tests/testthat/helper*.R') }}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
